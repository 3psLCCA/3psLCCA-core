[build-system]
requires = [
    "setuptools >= 61.0", # required for PEP 660 support - builds the package.
    "packaging >= 21.0"   # used by _build_backend.py to validate -C version=X.Y.Z
]
build-backend = "_build_backend" # Wraps setuptools.build_meta to require -C version=X.Y.Z.
backend-path = ["."]

[tool.setuptools.packages.find]
where = ["src"]
include = ["three_ps_lcca_core*"] # Exclude src/examples from the distributed wheel.

[tool.setuptools.dynamic]
version = {file = "VERSION"} # Written by _build_backend.py from -C version=X.Y.Z; not tracked in git.


[project]
name = "three_ps_lcca_core"
dynamic = ["version"]   # Read from ./VERSION; see DEVELOPING.md for how to build.
dependencies = []
requires-python = ">= 3.12"

description = "A Python module for performing Life Cycle Cost Analysis (LCCA) on bridge structures, covering road user cost (vehicle operation, value of time, congestion, accident, and carbon emission costs) and stage costs (initial, maintenance, reconstruction, and end-of-life)."

authors = [
    {name = "Osdag", email = "osdag@fossee.in"}
]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["life cycle cost analysis", "road user cost", "bridge engineering"]